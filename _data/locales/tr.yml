# The layout text of site

# ----- Commons label -----

layout:
  post: Yazı
  category: Kategori
  tag: Etiket

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Ana Sayfa
  categories: Kategoriler
  tags: Etiketler
  archives: Yazı Arşivi
  about: Hakkında

# the text displayed in the search bar & search results
search:
  hint: Ara...
  cancel: İptal
  no_results: Sonuç bulunamadı.

panel:
  lastmod: Son Güncellemeler
  trending_tags: Yükselen Etiketler
  toc: İçindekiler

# The date format (Chirpy v7 reads these keys)
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

copyright:
  # Shown at the bottom of the post
  license:
    template: Bu gönderi :LICENSE_NAME lisansı altındadır.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/deed.tr

  # Displayed in the footer
  brief: Bazı hakları saklıdır.
  verbose: >-
    Aksi belirtilmediği sürece, bu sitedeki gönderiler
    Creative Commons Atıf 4.0 Uluslararası (CC BY 4.0) Lisansı altındadır.
    Kısaca sayfa linkini vererek değiştirebilir / paylaşabilirsiniz.

meta: :PLATFORM ve :THEME teması

not_found:
  statement: Üzgünüz, bu bağlantıyı yanlış yerleştirmişiz ya da var olmayan bir sayfaya işaret ediyor.
  hint_template: ':HEAD_BAK ile geri dönmeyi deneyin ya da :ARCHIVES_PAGE üzerinde arayın.'
  head_back: Ana sayfaya dön
  archives_page: Arşiv sayfası

